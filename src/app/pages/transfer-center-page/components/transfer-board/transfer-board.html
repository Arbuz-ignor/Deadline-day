<article class="board-card">
  <header class="board-header">
    <div class="board-header-text">
      <p>Активные переговоры</p>
      <h3>Трансферная доска</h3>
    </div>

    <div class="filter">
      <button class="filter-all" type="button">Все</button>
      <button class="filter-in" type="button">Входящие</button>
      <button class="filter-out" type="button">Исходящие</button>
    </div>
  </header>

  <div class="lines">
    @for (row of rows(); track row.id) {
      <div class="line-transfer" (click)="dealSelected.emit(row.id)">
        <div class="line-transfer-player">
          <img
            [src]="row.playerPhotoUrl"
            [alt]="row.playerName"
            (error)="$any($event.target).src = 'assets/players/livramento.png'"
          />

          <div class="line-transfer-title">
            <span class="line-transfer-title-name">{{ row.playerName }}</span>
            <span class="line-transfer-title-position">{{ row.positionLabel }}</span>
          </div>
        </div>

        <div class="line-transfer-cost">
          <span>Предложение</span>
          <strong>{{ row.transferFeeLabel }}</strong>
        </div>

        <div class="line-transfer-cost line-transfer-cost-salary">
          <span>Зарплата предложения</span>
          <strong>{{ row.weeklyWageLabel }}</strong>
        </div>

        <div class="line-transfer-end">
          <div class="line-transfer-recent">
            <span
              class="line-transfer-recent-status"
              [class.line-transfer-recent-status--decision]="
                row.status === 'medicalDecisionRequired'
              "
              [class.line-transfer-recent-status--rejected]="row.status === 'rejected'"
              [class.line-transfer-recent-status--muted]="
                row.status === 'cancelled' || row.status === 'completed'
              "
              >{{ row.stageLabel }}</span
            >
            <span class="line-transfer-recent-time">{{ row.updatedAtLabel }}</span>
          </div>

          <div class="line-transfer-bar"></div>
        </div>
      </div>
    }
  </div>
</article>
