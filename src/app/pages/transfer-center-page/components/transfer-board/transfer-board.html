<article class="board-card">
  <header class="board-header">
    <div class="board-header-text">
      <p>Активные переговоры</p>
      <h3>Трансферная доска</h3>
    </div>

    <div class="filter">
      <button class="filter-all" type="button">Все</button>
      <button class="filter-in" type="button">Входящие</button>
      <button class="filter-out" type="button">Исходящие</button>
    </div>
  </header>

  <div class="lines">
    @for (row of rows(); track row.id) {
      <div class="line-transfer" (click)="dealSelected.emit(row.id)">
        <img [src]="row.playerPhotoUrl" alt="Tino Livramento" />

        <div class="line-transfer-title">
          <span class="line-transfer-title-name">{{ row.playerName }}</span>
          <span class="line-transfer-title-position">{{ row.playerDescription }}</span>
        </div>

        <div class="line-transfer-cost">
          <span>Оценка</span>
          <strong>{{ row.transferFeeLabel }}</strong>
        </div>

        <div class="line-transfer-recent">
          <span class="line-transfer-recent-status">{{ row.stageLabel }}</span>
          <span class="line-transfer-recent-time">{{ row.updatedAtLabel }}</span>
        </div>

        <div class="line-transfer-bar">
          <span>{{ row.progress }}%</span>
          <div class="line-transfer-bar-track" role="progressbar">
            <i [style.width.%]="row.progress"></i>
          </div>
        </div>
      </div>
    }
  </div>
</article>
