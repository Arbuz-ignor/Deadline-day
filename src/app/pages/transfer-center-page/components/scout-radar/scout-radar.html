<section class="scout">
  <p class="scout__caption">SCOUT REPORT</p>

  <h2 class="scout__title">Характеристики {{ playerName().split(' ').slice(-1).join('') }}</h2>

  <div class="scout__graph-placeholder">
    <div
      class="scout__stat"
      [class.scout__stat--poor]="stats().passing === 'плохо'"
      [class.scout__stat--medium]="stats().passing === 'средне'"
      [class.scout__stat--good]="stats().passing === 'хорошо'"
    >
      <span>ПЕРЕДАЧИ</span>
      <div class="scout__scale"><i></i><i></i><i></i></div>
      <strong>{{ stats().passing }}</strong>
    </div>

    <div
      class="scout__stat"
      [class.scout__stat--poor]="stats().shooting === 'плохо'"
      [class.scout__stat--medium]="stats().shooting === 'средне'"
      [class.scout__stat--good]="stats().shooting === 'хорошо'"
    >
      <span>УДАР</span>
      <div class="scout__scale"><i></i><i></i><i></i></div>
      <strong>{{ stats().shooting }}</strong>
    </div>

    <div
      class="scout__stat"
      [class.scout__stat--poor]="stats().technique === 'плохо'"
      [class.scout__stat--medium]="stats().technique === 'средне'"
      [class.scout__stat--good]="stats().technique === 'хорошо'"
    >
      <span>ТЕХНИКА</span>
      <div class="scout__scale"><i></i><i></i><i></i></div>
      <strong>{{ stats().technique }}</strong>
    </div>

    <div
      class="scout__stat"
      [class.scout__stat--poor]="stats().physical === 'плохо'"
      [class.scout__stat--medium]="stats().physical === 'средне'"
      [class.scout__stat--good]="stats().physical === 'хорошо'"
    >
      <span>ФИЗИКА</span>
      <div class="scout__scale"><i></i><i></i><i></i></div>
      <strong>{{ stats().physical }}</strong>
    </div>

    <div
      class="scout__stat"
      [class.scout__stat--poor]="stats().defending === 'плохо'"
      [class.scout__stat--medium]="stats().defending === 'средне'"
      [class.scout__stat--good]="stats().defending === 'хорошо'"
    >
      <span>ЗАЩИТА</span>
      <div class="scout__scale"><i></i><i></i><i></i></div>
      <strong>{{ stats().defending }}</strong>
    </div>
  </div>
</section>
