<section class="scout">
  <p class="scout__caption">SCOUT REPORT</p>

  <h2 class="scout__title">Характеристики {{ playerName().split(' ').slice(-1).join('') }}</h2>

  <div class="scout__graph-placeholder">
    @for (stat of statRows(); track stat.label) {
      <div
        class="scout__stat"
        [class.scout__stat--poor]="stat.level === 'плохо'"
        [class.scout__stat--medium]="stat.level === 'средне'"
        [class.scout__stat--good]="stat.level === 'хорошо'"
      >
        <span>{{ stat.label }}</span>

        <div class="scout__scale" aria-hidden="true">
          @for (segment of scaleSegments; track segment) {
            <i></i>
          }
        </div>

        <strong>{{ stat.level }}</strong>
      </div>
    }
  </div>
</section>
