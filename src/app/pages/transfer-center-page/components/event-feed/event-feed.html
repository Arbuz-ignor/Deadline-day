<article class="live-panel">
  <h3>Лента событий</h3>

  @if (hasDeals()) {
    <div class="timeline">
      <div class="event fresh">
        <time class="when" datetime="14:35">14:35</time>
        <span class="mark"></span>
        <p class="event-note">Агент запросил бонус за подписание <strong>€2 млн.</strong></p>
      </div>

    </div>
  } @else {
    <div class="event-feed-empty">
      <strong>Событий пока нет</strong>
    </div>
  }
</article>
