<section class="transfer-center-page">
  <app-game-header
    day="Понедельник · 10 августа"
    pageTitle="Трансферный центр"
    wageBudget="€118ТЫС"
    transferBudget="€118M"
    timeLeft="05:47:09"
  />

  <div class="top-table">
    @for (content of selectedDealContent(); track content.deal.id) {
      <app-active-deal-card
        class="deal-switch-card"
        [player]="content.player"
        [deal]="content.deal"
        (offerRequested)="handleOfferRequest($event)"
      />

      <app-player-photo class="deal-switch-card" [player]="content.player" />

      <app-scout-radar
        class="deal-switch-card"
        [playerName]="content.player.name"
        [stats]="content.player.stats"
      />
    } @empty {
      <article class="empty-card empty-card--deal">
        <span class="empty-card__eyebrow">Активная сделка</span>
        <h2>Начните переговоры</h2>
      </article>

      <article class="empty-card empty-card--player">
        <span class="empty-card__eyebrow">Выбранный игрок</span>
        <h2>Игрок не выбран</h2>
      </article>

      <article class="empty-card empty-card--scout">
        <span class="empty-card__eyebrow">Скаутский отчёт</span>
        <h2>Данных пока нет</h2>
      </article>
    }
  </div>
  <div class="low-table">
    <app-transfer-board
      [deals]="gameStore.state().deals"
      [players]="gameStore.state().players"
      [selectedDealId]="gameStore.state().selectedDealId"
      (dealSelected)="gameStore.selectDeal($event)"
    />
    <app-event-feed [hasDeals]="hasDeals()" />
  </div>
</section>
