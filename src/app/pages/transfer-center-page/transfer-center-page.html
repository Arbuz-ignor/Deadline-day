<section class="transfer-center-page">
  <app-game-header
    day="Понедельник · 10 августа"
    pageTitle="Трансферный центр"
    wageBudget="€118ТЫС"
    transferBudget="€118M"
    timeLeft="05:47:09"
  />

  <div class="top-table">
    @for (content of selectedDealContent(); track content.deal.id) {
      <app-active-deal-card
        class="deal-switch-card"
        [player]="content.player"
        [deal]="content.deal"
      />

      <app-player-photo class="deal-switch-card" [player]="content.player" />

      <app-scout-radar
        class="deal-switch-card"
        [playerName]="content.player.name"
        [stats]="content.player.stats"
      />
    }
  </div>
  <div class="low-table">
    <app-transfer-board
      [deals]="gameStore.activeDeals()"
      [players]="gameStore.state().players"
      [selectedDealId]="gameStore.state().selectedDealId"
      (dealSelected)="gameStore.selectDeal($event)"
    />
    <app-event-feed></app-event-feed>
  </div>
</section>
