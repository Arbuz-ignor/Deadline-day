<article class="candidates-card">
  <header class="panel-head">
    <div class="panel-title">
      <p>Активные переговоры</p>
      <h2>Кандидаты</h2>
    </div>

    <div class="search-tools">
      <input type="search" placeholder="Поиск" />

      <button class="filter-button" type="button">
        <img class="filter-glyph" src="assets/icons/filter.png" />
      </button>
    </div>
  </header>

  <div class="candidate-grid">
    @for (player of players(); track player.id) {
      <div
        class="candidate-row"
        (click)="selectPlayer.emit(player.id)"
        [class.candidate-row--selected]="selectedPlayerId() === player.id"
      >
        <span class="candidate-main">
          <img [src]="player.photoUrl" [alt]="player.name" />

          <span class="candidate-copy">
            <strong>{{ player.name }}</strong>
            <small>{{ player.position }}</small>
          </span>
        </span>

        <span class="candidate-price">
          <small>Оценка</small>
          <strong>{{ formatMillions(player.estimatedValue) }}</strong>
        </span>
      </div>
    }
  </div>
</article>
