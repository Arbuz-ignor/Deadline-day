<article class="player-card">
  <div class="player-stack">
    <header class="panel-title">
      <p>Параметры игрока</p>
      <h2>Выбранный игрок</h2>
    </header>

    <section class="player-identity">
      <div class="identity-row">
        <img class="player-photo" src="assets/players/livramento.png" alt="Tino Livramento" />

        <div class="identity-main">
          <div class="identity-copy">
            <strong>Tino Livramento</strong>
            <small>ПЗ · Newcastle United</small>
          </div>

          <img class="club-logo" src="assets/clubs/newcastle.png" alt="Newcastle United" />
        </div>
      </div>

      <div class="tag-row">
        <span>Молодой талант</span>
        <span>Сложные переговоры</span>
      </div>
    </section>

    <div class="player-metrics">
      <div class="metric">
        <small>Оценка стоимости</small>
        <strong>€55M</strong>
      </div>

      <div class="metric">
        <small>Зарплата в клубе</small>
        <strong>€140 тыс</strong>
      </div>

      <div class="metric">
        <small>Контракт</small>
        <strong>5 лет</strong>
      </div>

      <div class="metric">
        <small>Возраст</small>
        <strong>19 лет</strong>
      </div>
    </div>
  </div>

  <button class="primary-button" type="button">Начать переговоры</button>
</article>
