<section class="scouting-page">
  <app-game-header
    day="Понедельник · 10 августа"
    pageTitle="Скаутинг"
    wageBudget="€118 тыс"
    transferBudget="€118 млн"
    timeLeft="05:47:09"
  />

  <div class="scouting-grid">
    <app-scouting-candidates
      [players]="gameStore.state().players"
      (selectPlayer)="gameStore.selectPlayer($event)"
      [selectedPlayerId]="gameStore.state().selectedPlayerId"
    />
    @if (gameStore.selectedPlayerById(); as player) {
      <app-scouting-player
        [player]="player"
        [deals]="gameStore.state().deals"
        (dealRequested)="startDeal($event)"
        [countActiveDeals]="gameStore.activeDeals().length"
      />
    }
  </div>
</section>
